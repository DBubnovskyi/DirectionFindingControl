<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1" />
  <title>The globe of extremes</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.12/esri/themes/light/main.css" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="viewDiv">
    <arcgis-scene id="sceneview" item-id="ea0dff6e8e3b442a9fe37560ee16f830">
      <arcgis-zoom position="top-left"> </arcgis-zoom>
      <arcgis-navigation-toggle position="top-left"> </arcgis-navigation-toggle>
      <arcgis-compass position="top-left"> </arcgis-compass>
    </arcgis-scene>
  </div>

  <script>
    const locationPath = location.pathname.replace(/\/[^\/]+$/, "");
    dojoConfig = {
      packages: [{
        name: "utils",
        location: locationPath + "utils"
      }],
      async: true
    };
  </script>

  <script src="https://js.arcgis.com/4.31/"></script>
  <script>
    let url =  `${window.location.href.replace('index5.html', '')}utils/ExaggeratedElevationLayer.js`
    let map;
    let view;
    
    // create a new instance of Map and add LercLayer
    var baseMaps = ["dark-gray", "dark-gray-3d", "dark-gray-vector", "gray", "gray-3d", "gray-vector", 
    "hybrid", "navigation-3d", "navigation-dark-3d", "oceans", "osm", "osm-3d", 
    "satellite", "streets", "streets-3d", "streets-dark-3d", "streets-navigation-vector", 
    "streets-night-vector", "streets-relief-vector", "streets-vector", "terrain", "topo", 
    "topo-3d", "topo-vector"];
    
    require([
      "esri/Map",
      "esri/views/SceneView",
      url,
    ], (Map, SceneView,   ExaggeratedElevationLayer) => {
      map = new Map({
        basemap: baseMaps[12],
      });

      view = new SceneView({
        container: "viewDiv",
        map: map,
        alphaCompositingEnabled: true,
        qualityProfile: "high",
        camera: {
          fov: 55,
          position: {
            latitude: 44.39006252879528,
            longitude: 34.065645317382945,
            z: 937.259094823151
          },
          heading: 25.521363443185887,
          tilt: 87.6187987574998
        },
      });
      
      map.ground.layers = [new ExaggeratedElevationLayer()];
    });
  </script>
</body>

</html>

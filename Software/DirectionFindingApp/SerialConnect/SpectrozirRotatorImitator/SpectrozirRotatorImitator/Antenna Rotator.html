
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Antenna Rotator</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            color: #e0e0e0;
        }

        .container {
            height: calc(100vh - 80px);
            width: 100%;
            margin: 0 auto;
            padding: 20px 15px 0px 15px;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            .container {
                height: calc(100vh - 40px);
                padding: 20px 20px 0 20px;
            }
        }

        .left-column {
            flex: 1 1 100%;
            transition: flex 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px 0;
        }

        .right-column {
            flex: 0 0 0%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;

            transition:
                flex 0.3s ease,
                max-height 0.3s ease,
                opacity 0.2s ease;
        }

        .container.map-visible .left-column {
            flex: 1 1 50%;
        }

        .container.map-visible .right-column {
            flex: 0 0 50%;
            max-height: 50%;
            opacity: 1;
        }

        .rows {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 600px;
        }

        .canvasContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            max-height: 50%;
            max-width: clamp(200px, 50%, 320px);
            width: 100%;
        }

        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            aspect-ratio: 1/1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .cardHeader,
        .cardFooter {
            width: 100%;
        }

        .settingsRow {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        @media (min-width: 768px) and (min-height: 1025px) {
            .canvasContainer {
                max-width: 320px;
                max-height: 320px;
            }

            .card {
                background: #1e1e1e;
                padding: 30px;
                border-radius: 12px;
                max-width: 600px;
                width: 100%;
            }
        }

        @media (max-height: 600px) {
            .container {
                padding-bottom: 0;
            }
            .card {
                max-width: clamp(340px, 40%, 50%);
            }
        }

        .coordsBlock {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;

            width: 272px;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .coords {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            font-size: 16px;
            margin-left: 6px;
        }

        .setCoords {
            position: absolute;
            z-index: 500;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
        }

        .angLbl {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .lbl {
            color: #e0e0e0;
            opacity: 0.7;
        }

        .header-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #323232;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #303030;
        }

        .saveBtn {
            background: rgba(0, 158, 225, 1);
        }

        .saveBtn:hover {
            background: rgba(0, 140, 200, 1);
        }

        .input {
            padding: 8px;
            border-radius: 6px;
        }

        .inputsContainer {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row-reverse;
                justify-content: center;
            }

            .left-column {
                flex: 1 1 100%;
            }

            .container.map-visible .left-column {
                flex: 1 1 50%;
            }

            .right-column {
                max-height: 100%;
                max-width: 0;
                flex: 0 0 0%;
            }

            .container.map-visible .right-column {
                flex: 0 0 50%;
                max-width: 50%;
                max-height: 100%;
                opacity: 1;
            }

        }

        .tooltip {
            position: absolute;
            bottom: 120%;
            right: 0;

            background: #222;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;

            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .spacer {
            width: 100%;
            min-height: 20px;
            display: none;
        }

        #copiedHint {
            position: absolute;
            bottom: -40px;

            background: #222;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;

            display: none;
        }

        #setCoordsBtn:hover .tooltip {
            opacity: 1;
        }

        #value {
            font-weight: bold;
            margin-left: 10px;
        }

        #cnv {
            display: block;
            cursor: crosshair;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
    </style>
</head>

                        </svg>

                </div>
                <div class="setCoords">

            <div id="settingsCard" class="card" style="display:none; aspect-ratio: unset;">
                <div class="cardHeader" style="margin-bottom:30px">
                    <div class="header-row">
                        <span class="lbl">Settings</span>

                                        d="M7.2 11.2C7.2 11.6418 7.55816 12 8 12C8.44184 12 8.8 11.6418 8.8 11.2H7.2ZM4.97254 9.91376C5.40397 9.81848 5.67646 9.39152 5.58118 8.96008C5.48588 8.52864 5.0589 8.25616 4.62746 8.35144L4.97254 9.91376ZM11.3726 8.35144C10.9411 8.25616 10.5141 8.52864 10.4188 8.96008C10.3235 9.39152 10.596 9.81848 11.0274 9.91376L11.3726 8.35144ZM10.4 4C10.4 5.32548 9.32552 6.4 8 6.4V8C10.2091 8 12 6.20914 12 4H10.4ZM8 6.4C6.67448 6.4 5.6 5.32548 5.6 4H4C4 6.20914 5.79086 8 8 8V6.4ZM5.6 4C5.6 2.67452 6.67448 1.6 8 1.6V0C5.79086 0 4 1.79086 4 4H5.6ZM8 1.6C9.32552 1.6 10.4 2.67452 10.4 4H12C12 1.79086 10.2091 0 8 0V1.6ZM7.2 7.2V11.2H8.8V7.2H7.2ZM14.4 12C14.4 12.1815 14.3206 12.4146 14.0546 12.6941C13.7849 12.9776 13.3566 13.2693 12.7662 13.5317C11.5875 14.0555 9.90312 14.4 8 14.4V16C10.0734 16 11.9889 15.6281 13.4161 14.9938C14.1286 14.677 14.7548 14.2793 15.2137 13.797C15.6765 13.3108 16 12.7022 16 12H14.4ZM8 14.4C6.09691 14.4 4.41246 14.0555 3.23374 13.5317C2.64338 13.2693 2.21514 12.9776 1.94533 12.6941C1.67944 12.4146 1.6 12.1815 1.6 12H0C0 12.7022 0.323504 13.3108 0.786296 13.797C1.24516 14.2793 1.87134 14.677 2.58392 14.9938C4.01109 15.6281 5.92663 16 8 16V14.4ZM1.6 12C1.6 11.7459 1.76644 11.3707 2.37085 10.9461C2.96103 10.5315 3.85235 10.1612 4.97254 9.91376L4.62746 8.35144C3.3769 8.62768 2.26822 9.0628 1.45109 9.63688C0.648184 10.201 0 10.9976 0 12H1.6ZM11.0274 9.91376C12.1477 10.1612 13.039 10.5315 13.6291 10.9461C14.2336 11.3707 14.4 11.7459 14.4 12H16C16 10.9976 15.3518 10.201 14.5489 9.63688C13.7318 9.0628 12.6231 8.62768 11.3726 8.35144L11.0274 9.91376Z"

                <hr style="border-color:#111; margin: 15px 0;">

                <div class="settingsRow">
                    <div class="inputsContainer">
                        <label class="lbl" for="sweep">Sweep Angle (°):</label>
                        <input id="sweep" class="input" type="number" min="90" max="360" value="220">
                    </div>
                    <button id="saveSweepBtn" class="btn saveBtn">Save</button>
                </div>

                <hr style="border-color:#111; margin: 15px 0;">

                <div class="settingsRow">
                    <div class="inputsContainer">
                        <!-- IP Address -->
                        <label class="lbl" for="ipAddr">Device IP address:</label>
                        <input id="ipAddr" class="input" type="text" value="192.168.1.12">
                    </div>
                    <button id="saveIPAdrBtn" class="btn saveBtn">Save</button>
                </div>

                <hr style="border-color:#111; margin: 15px 0;">

                <!-- Calibration -->
                <span class="lbl">Advanced (Rotation calibration):</span>
                <br />
                <span class="lbl">Rotate to the desired angle and press the SET button, then press SAVE</span>

                <div class="settingsRow">
                    <div
                        style="display:grid; grid-template-columns: 40px 100px 60px; gap: 4px 8px; margin-top: 15px;  align-items: center;  ">

                        <span>-180</span>
                        <input id="cal__n180" class="input" type="number" value="0">
                        <button class="btn" onclick="document.getElementById('cal__n180').value = curDac">Set</button>

                        <span>-90</span>
                        <input id="cal__n90" class="input" type="number" value="0">
                        <button class="btn" onclick="document.getElementById('cal__n90').value = curDac">Set</button>

                        <span>0</span>
                        <input id="cal__0" class="input" type="number" value="0">
                        <button class="btn" onclick="document.getElementById('cal__0').value = curDac">Set</button>

                        <span>+90</span>
                        <input id="cal__90" class="input" type="number" value="0">
                        <button class="btn" onclick="document.getElementById('cal__90').value = curDac">Set</button>

                        <span>+180</span>
                        <input id="cal__180" class="input" type="number" value="0">
                        <button class="btn" onclick="document.getElementById('cal__180').value = curDac">Set</button>

                    </div>

                </div>

            </div>

            <span id="snText" class="lbl" style="text-align: center; font-size: 12px;">S/N ___</span>

    <script>
        const canvas = document.getElementById("cnv");
        const ctx = canvas.getContext("2d");
        const setSpan = document.getElementById("setAngle");
        const curSpan = document.getElementById("curAngle");
        const azymuthAngleSpan = document.getElementById("azymuthAngle");
        const slider = document.getElementById("angleSlider");

        let setAngle = 0;
        let curAngle = 0;
        let sweepAngle = 220;
        let azimuth = 300;

        let centerLat = 50.4501;
        let centerLng = 30.5234;

        // Convert degrees to radians
        function deg2rad(deg) {
            return deg * Math.PI / 180;
        }

        // Draw circle with arrows
        function draw() {
            const w = canvas.width;
            const h = canvas.height;

            const r = Math.min(w, h) / 2 - 20;
            const rMin = Math.min(w, h) / 12;

            const cColor = "#666666"

            const startSweepAngle = -(sweepAngle) / 2;
            const stopSweepAngle = (sweepAngle) / 2;

            ctx.clearRect(0, 0, w, h);

            // Draw outer circle

            drawArc(startSweepAngle - 90, stopSweepAngle - 90, r, cColor, 3);
            drawArc(0, 360, r - 2, cColor, 1);


            drawArrow(startSweepAngle, r - 1, cColor, 3, false, false);
            drawArrow(stopSweepAngle, r - 1, cColor, 3, false, false);

            drawArrow(0, r + 10, cColor, 1, false, false);
            drawArrow(45, r + 10, cColor, 1, false, false);
            drawArrow(90, r + 10, cColor, 1, false, false);
            drawArrow(135, r + 10, cColor, 1, false, false);
            drawArrow(180, r + 10, cColor, 1, false, false);
            drawArrow(225, r + 10, cColor, 1, false, false);
            drawArrow(270, r + 10, cColor, 1, false, false);
            drawArrow(315, r + 10, cColor, 1, false, false);


            // Draw set angle arrow 
            drawArrow(setAngle, r + 15, "#00B2FF", 3, true, false);

            // Draw current angle arrow
            drawArrow(curAngle, r + 15, "#FFE500", 3, false, true);

            drawArc(startSweepAngle - 90, stopSweepAngle - 90, rMin, "#FFE500", 3);
            drawArc(0, 360, 5, "#FFE500", 6);


        }

        function drawArc(startAngle, stopAngle, radius, color, width) {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            // Draw outer circle
            ctx.beginPath();
            ctx.arc(cx, cy, radius - 2, deg2rad(startAngle), deg2rad(stopAngle));
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        }

        function drawArrow(angleDeg, radius, color, width, dashline, drawArrow) {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            // Draw set angle arrow (red)
            const sx = cx + radius * Math.cos(deg2rad(angleDeg - 90));
            const sy = cy + radius * Math.sin(deg2rad(angleDeg - 90));
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(sx, sy);


            if (drawArrow) {
                // calc arrowhead points
                var x225 = sx + 15 * Math.cos(deg2rad(angleDeg - 90 + 225));
                var y225 = sy + 15 * Math.sin(deg2rad(angleDeg - 90 + 225));
                var x135 = sx + 15 * Math.cos(deg2rad(angleDeg - 90 + 135));
                var y135 = sy + 15 * Math.sin(deg2rad(angleDeg - 90 + 135));

                // draw partial arrowhead at 225 degrees
                ctx.moveTo(sx, sy);
                ctx.lineTo(x225, y225);
                // draw partial arrowhead at 135 degrees
                ctx.moveTo(sx, sy);
                ctx.lineTo(x135, y135);
            }


            if (dashline) ctx.setLineDash([width, width]);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        canvas.addEventListener("mousedown", handleCanvas);
        canvas.addEventListener("mousemove", (e) => {
            if (e.buttons === 1) handleCanvas(e);  // drag with left mouse
        });

        function handleCanvas(e) {
            const box = canvas.getBoundingClientRect();

            const cx = box.left + box.width / 2;
            const cy = box.top + box.height / 2;

            const dx = e.clientX - cx;
            const dy = e.clientY - cy;

            // Canvas Y-axis is inverted → flip dy
            const angleRad = Math.atan2(-dy, dx);
            let angleDeg = angleRad * 180 / Math.PI;

            angleDeg = -angleDeg + 90;

            // Normalize to -180..180
            if (angleDeg > 180) angleDeg -= 360;

            var pointerAngle = angleDeg;
            sendAngle(pointerAngle);
            angleSlider.value = pointerAngle;
        }

        // Toggle Settings visibility
        const btnSettings = document.getElementById("btnSettings");
        const settingsCard = document.getElementById("settingsCard");
        const leftCol = document.getElementById("leftColumn");
        const closeSettingsBtn = document.getElementById("closeSettingsBtn");
        const bottomSpacer = document.getElementById("bottomSpacer");

        btnSettings.addEventListener("click", () => {
            settingsCard.style.display = settingsCard.style.display === "none" ? "block" : "none";
            leftCol.style.justifyContent = settingsCard.style.display === "none" ? "center" : "flex-start";
            bottomSpacer.style.display = settingsCard.style.display === "none" ? "none" : "block";
            if (map) {
                if (settingsCard.style.display === "none") {
                    mapCenterMarker.setLatLng(startLatLng);
                }
                else {
                    mapCenterMarker.setLatLng(map.getCenter());
                }
            }
        });

        closeSettingsBtn.addEventListener("click", () => {
            settingsCard.style.display = "none";
            leftCol.style.justifyContent = "center";
            if (map) {
                mapCenterMarker.setLatLng(startLatLng);
            }
        });

        // Send to ESP32 when slider moves
        slider.addEventListener("input", () => {
            sendAngle(parseInt(slider.value));
        });

        function sendAngle(angle) {
            setAngle = angle;
            setSpan.textContent = Math.round(angle) + "°";

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: "setAngle", value: setAngle }));
            }

            draw();
        }

        function updateMapCoordinates() {
            const angle = Math.round(getAzimuthAngle()) + "°";

            document.getElementById("coords").textContent = `${centerLat.toFixed(4)}, ${centerLng.toFixed(4)} | Az: ${angle}`;
        }

        function initWebSocket() {
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onopen = () => {
                console.log("[WS] Connected");
            };

            ws.onerror = (err) => {
                console.log("[WS] Error:", err);
            };

            ws.onclose = (ev) => {
                console.log("[WS] Closed:", ev.code, ev.reason);
                // try reconnect in 1s
                setTimeout(initWebSocket, 1000);
            };

            ws.onmessage = (msg) => {
                try {
                    const json = JSON.parse(msg.data);

                    if ("command" in json) {
                        const cmd = json.command;
                        if(cmd === "angle") {
                            if ("angle" in json) {
                                curAngle = json.angle;
                                setAngle = json.req_angle

                                slider.value = setAngle;

                                curSpan.textContent = Math.round(curAngle) + "°";
                                azymuthAngleSpan.textContent = Math.round(getAzimuthAngle()) + "°";
                                draw();  // redraw canvas with updated angle
                                updateMap();
                                updateMapCoordinates()
                            }

                            if ("dac" in json) {
                                curDac = Math.round(json.dac);
                            }                        
                        }
                        else if (cmd === "settings") {
                            loadSettings();
                        }
                    }
                } catch (e) {
                    console.error(e);
                }
            };
        }

        document.getElementById("saveSweepBtn").onclick = saveSweepAndAzimuth;
        document.getElementById("saveAzimuthBtn").onclick = saveSweepAndAzimuth;
        document.getElementById("saveIPAdrBtn").onclick = saveIPAddress;
        document.getElementById("saveCalBtn").onclick = saveCalibration;
        document.getElementById("setGeoCenterBtn").onclick = setGetCenter;
        document.getElementById("saveGeoCoordinatesBtn").onclick = saveGeoCoordinates;

        async function loadSettings() {

            try {
                const res = await fetch("/settings");

                if (!res.ok) {
                    console.error("Settings request failed:", res.status);
                    return;
                }

                const cfg = await res.json();

                document.getElementById("sweep").value = cfg.sweep;
                sweepAngle = parseInt(cfg.sweep);
                slider.min = -(sweepAngle / 2);
                slider.max = sweepAngle / 2;

                document.getElementById("azimuth").value = cfg.azimuth;
                azimuth = parseInt(cfg.azimuth);

                centerLat = cfg.lat;
                centerLng = cfg.lng;
                if (map) {
                    startLatLng = L.latLng(centerLat, centerLng);
                }
                document.getElementById("latitude").value = centerLat;
                document.getElementById("longitude").value = centerLng;

                document.getElementById("ipAddr").value = cfg.ip;

                document.getElementById("cal__n180").value = cfg.c_n_180;
                document.getElementById("cal__n90").value = cfg.c_n_90;
                document.getElementById("cal__0").value = cfg.c_0;
                document.getElementById("cal__90").value = cfg.c_90;
                document.getElementById("cal__180").value = cfg.c_180;

                document.getElementById("snText").textContent = "S/N " + cfg.sn + " / " + cfg.version;

                draw();
                updateMap();
                updateMapCoordinates();

            } catch (e) {
                console.error("Error loading settings:", e);
            }
        }

        async function saveSweepAndAzimuth() {
            const payload = {
                sweep: parseInt(document.getElementById("sweep").value),
                azimuth: parseInt(document.getElementById("azimuth").value)
            };

            const res = await fetch("/settings/angle", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                loadSettings();
            }
            else alert("Error saving sweep/azimuth");
        }

        async function saveIPAddress() {
            const payload = {
                ip: document.getElementById("ipAddr").value.trim()
            };

            const res = await fetch("/settings/ip", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                loadSettings();
            }
            else alert("Error saving IP");
        }

        async function saveCalibration() {
            const payload = {
                c_n_180: parseInt(document.getElementById("cal__n180").value),
                c_n_90: parseInt(document.getElementById("cal__n90").value),
                c_0: parseInt(document.getElementById("cal__0").value),
                c_90: parseInt(document.getElementById("cal__90").value),
                c_180: parseInt(document.getElementById("cal__180").value)
            };

            const res = await fetch("/settings/cal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                loadSettings();
            }
            else alert("Error saving calibration");
        }

        async function saveGeoCoordinates() {
            const payload = {
                lat: parseFloat(document.getElementById("latitude").value),
                lng: parseFloat(document.getElementById("longitude").value),
            };

            if (Number.isNaN(payload.lat) || Number.isNaN(payload.lng)) {
                alert("Invalid coordinates");
                return;
            }

            const res = await fetch("/settings/geo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                loadSettings();
            }
            else alert("Error saving geo coordinates");
        }



        async function setGetCenter() {
            if (map) {
                let centerOfMap = map.getCenter();
                document.getElementById("latitude").value = centerOfMap.lat;
                document.getElementById("longitude").value = centerOfMap.lng;
            }
        }



        //Load map 
        function loadCss(href) {
            return new Promise((resolve, reject) => {
                const link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = href;
                link.onload = resolve;
                link.onerror = reject;
                document.head.appendChild(link);
            });
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = src;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }

        async function loadLeafletSafely() {
            try {

                if (window.L) return;

                await loadCss("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
                await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
                await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet.polylinedecorator/1.7.0/leaflet.polylineDecorator.min.js");

                console.log("Leaflet loaded");
                initMap();   // your map init function

            } catch (e) {
                console.warn("Leaflet unavailable (offline)");
                // Map will stay disabled, UI still works
            }
        }



        // Start point (latitude, longitude)
        let startLatLng;

        let map;
        let mapCenterMarker;
        let line;
        let decorator;
        let mapVisible = false;

        function getAzimuthAngle() {
            if (curAngle < 0) {
                return (360 + curAngle + azimuth) % 360;
            }
            return (curAngle + azimuth) % 360;
        }

        // Function to calculate end point based on distance and angle
        function destinationPoint(latlng, distanceMeters, angleDeg) {
            const R = 6378137; // Earth radius in meters
            const δ = distanceMeters / R; // angular distance in radians
            const θ = angleDeg * Math.PI / 180;

            const φ1 = latlng.lat * Math.PI / 180;
            const λ1 = latlng.lng * Math.PI / 180;

            const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
            const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));

            return L.latLng(φ2 * 180 / Math.PI, λ2 * 180 / Math.PI);
        }

        document.getElementById("btnToggleMap").addEventListener("click", async () => {
            mapVisible = !mapVisible;


            if (mapVisible && !map) {

                await loadLeafletSafely();

                if (window.L) {
                    startLatLng = L.latLng(centerLat, centerLng);

                    map = L.map('map').setView(startLatLng, 13);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    // create the line only once
                    const endLatLng = destinationPoint(startLatLng, 30000, getAzimuthAngle());
                    line = L.polyline([startLatLng, endLatLng], { color: 'red', weight: 3 }).addTo(map);


                    mapCenterMarker = L.circleMarker(map.getCenter(), {
                        radius: 12,
                        color: 'red',
                        opacity: 1
                    }).addTo(map);

                    map.on('move', () => {
                        if (settingsCard.style.display === "none") {
                            mapCenterMarker.setLatLng(startLatLng);
                        }
                        else {
                            mapCenterMarker.setLatLng(map.getCenter());
                        }
                    });
                }
                else {
                    mapVisible = false;
                    alert("Unable to load map. Check your internet connection.");
                }
            }

            //NEW LOGIC TO CONTROL ALL LAYOUT AND MAKE ANIMATION SMOOTHER
            const container = document.querySelector('.container');
            container.classList.toggle('map-visible', mapVisible);

            if (mapVisible && map) {
                updateMapCoordinates();
                setTimeout(() => map.invalidateSize(), 300);
            }
        });

        document.getElementById("copyCoordsBtn").addEventListener("click", () => {

            const textToCopy = document.getElementById('coords').textContent;

            const textarea = document.createElement("textarea");
            textarea.value = textToCopy;
            textarea.style.position = "fixed"; 
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                document.execCommand("copy");
                document.getElementById("copiedHint").style.display = "block";
                setTimeout(() => {
                    document.getElementById("copiedHint").style.display = "none";
                }, 2000);
            } catch (err) {
                alert("Copy failed");
            }

            document.body.removeChild(textarea);
        });

        document.getElementById('setCoordsBtn').addEventListener('click', () => {
            if (!map) return;
            startLatLng = L.latLng(centerLat, centerLng);
            map.setView(startLatLng, 13);
        })

        function updateMap() {
            if (mapVisible && map && line) {
                const length = 30000;
                const newEnd = destinationPoint(startLatLng, length, getAzimuthAngle());

                line.setLatLngs([startLatLng, newEnd]);
            }
        }

        initWebSocket();
        loadSettings();
        draw();
    </script>
